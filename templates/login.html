<!DOCTYPE html>
<html>
<head>
  <title>College ERP Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width:350px;">
  <h3 class="text-center mb-3">College ERP</h3>

  <input class="form-control mb-3" type="text" placeholder="Username">

  <input class="form-control mb-3" type="password" placeholder="Password">

  <select class="form-select mb-3">
    <option>Student</option>
    <option>Faculty</option>
    <option>Admin</option>
  </select>

  <button class="btn btn-primary w-100">Login</button>
</div>

</body>
</html>
